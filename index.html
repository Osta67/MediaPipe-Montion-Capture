<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitRise Alarm</title>
    <style>
        body { background: #121212; color: #00ff88; font-family: 'Arial', sans-serif; text-align: center; padding-top: 100px; }
        #clock { font-size: 5rem; font-weight: bold; margin-bottom: 20px; }
        input[type="time"] { font-size: 1.5rem; padding: 10px; border-radius: 8px; border: none; }
        button { background: #00ff88; color: #121212; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>FitRise: Wake Up & Move</h1>
    <div id="clock">00:00:00</div>
    <input type="time" id="alarmTime">
    <br>
   <button onclick="window.saveAlarm()">Set Morning Alarm</button>
    
 <script type="module">
    console.log("1. Script is running...");

    // Import Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    console.log("2. Firebase libraries imported...");

    const firebaseConfig = {
        apiKey: "AIzaSyBLNz5NxJkxoeTPtxg_m5P547ID4bkiW7Q",
        authDomain: "mediapipe-motioncapture-new.firebaseapp.com",
        projectId: "mediapipe-motioncapture-new",
        storageBucket: "mediapipe-motioncapture-new.firebasestorage.app",
        messagingSenderId: "194144536036",
        appId: "1:194144536036:web:01a57bbef13074c42733f1"
    };

    try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // --- THIS IS THE MESSAGE YOU NEED ---
        console.log("3. Firestore Database connected successfully!");
        
        // Attach functions to window so the buttons can see them
        window.saveAlarm = function() {
            const val = document.getElementById('alarmTime').value;
            if (val) {
                localStorage.setItem('userAlarm', val);
                alert("Alarm saved for " + val);
            } else {
                alert("Please select a time first!");
            }
        };

        window.triggerAlarm = async function() {
            console.log("Attempting to write to Firestore...");
            try {
                await setDoc(doc(db, "alarms", "current"), { 
                    isTriggered: true,
                    timestamp: new Date()
                }, { merge: true });
                console.log("Firestore Updated!");
                window.location.href = "https://your-app-name.streamlit.app?alarm=active";
            } catch (e) {
                console.error("Firestore Write Error:", e);
                alert("Database error! Check your Firebase Rules.");
            }
        };

    } catch (error) {
        console.error("Firebase Initialization Error:", error);
    }

    // Alarm Checker Logic
    setInterval(() => {
        const now = new Date();
        const timeString = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
        const target = localStorage.getItem('userAlarm');

        if (target === timeString) {
            window.triggerAlarm();
        }
    }, 1000);
</script>
</body>
</html>
document.getElementById('saveBtn').addEventListener('click', () => {
    const time = document.getElementById('alarmTime').value;
    localStorage.setItem('userAlarm', time);
    alert("Alarm saved for " + time);
});
