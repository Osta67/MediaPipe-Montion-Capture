<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitRise Alarm</title>
    <style>
        body { background: #121212; color: #00ff88; font-family: 'Arial', sans-serif; text-align: center; padding-top: 100px; }
        #clock { font-size: 8rem; font-weight: bold; margin-bottom: 20px; }
        input[type="time"] { font-size: 2rem; padding: 10px; border-radius: 8px; border: none; margin-bottom: 20px; }
        .btn { background: #00ff88; color: #121212; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;}
        .btn:hover { background: #00cc6e; transform: scale(1.05); }
    </style>
</head>
<body>

    <h1 style="font-size: 2.5rem;">FitRise: Wake Up & Move</h1>
    <div id="clock">00:00:00</div>
    
    <input type="time" id="alarmTime">
    <br>
    
    <button class="btn" id="saveBtn">Set Alarm</button>

    <script>
        // 1. Update the Clock display every second
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }, 1000);

        // 2. The logic that was showing on your screen - now safely inside <script>
        document.getElementById('saveBtn').addEventListener('click', () => { 
            const time = document.getElementById('alarmTime').value;
            if (time) {
                localStorage.setItem('userAlarm', time); 
                alert("Alarm saved for " + time); 
            } else {
                alert("Please select a time first!");
            }
        });
    </script>
</body>
</html>
    
<script type="module">

const now = new Date();
const currentHHMM = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
const savedAlarm = localStorage.getItem('userAlarm'); // Ensure this is exactly "HH:MM"

console.log(`Debug: Current=${currentHHMM} | Target=${savedAlarm}`);

if (currentHHMM === savedAlarm) {
    // Only trigger once so it doesn't loop
    if (!window.alarmHasTriggered) {
        window.alarmHasTriggered = true;
        triggerAlarm();
    }
}
    }, 1000);

async function triggerAlarm() {
    console.log("ALARM HIT! Updating UI...");
    
    // 1. Update Firebase
    try {
        await setDoc(doc(db, "alarms", "current"), { 
            isTriggered: true,
            timestamp: new Date() 
        }, { merge: true });
    } catch (e) {
        console.error("Firebase update failed:", e);
    }

    // 2. Instead of forcing a redirect, show a button
    const alarmDiv = document.createElement('div');
    alarmDiv.innerHTML = `
        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:red; z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column;">

    `;
    document.body.appendChild(alarmDiv);

    // 3. Make the button redirect
    document.getElementById('startWorkoutBtn').onclick = () => {
        window.location.href = "https://your-app-name.streamlit.app";
    };
}
    // Button Listener
    document.getElementById('saveBtn').addEventListener('click', () => {
        const time = document.getElementById('alarmTime').value;
        localStorage.setItem('userAlarm', time);
        alert("Alarm set for " + time);
    });
</script>
