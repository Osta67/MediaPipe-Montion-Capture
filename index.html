<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitRise Alarm</title>
    <style>
        body { background: #121212; color: #00ff88; font-family: 'Arial', sans-serif; text-align: center; padding-top: 100px; }
        #clock { font-size: 8rem; font-weight: bold; margin-bottom: 20px; }
        input[type="time"] { font-size: 2rem; padding: 10px; border-radius: 8px; border: none; margin-bottom: 20px; }
        .btn { background: #00ff88; color: #121212; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;}
        .btn:hover { background: #00cc6e; transform: scale(1.05); }
    </style>
</head>
<body>

    <h1 style="font-size: 2.5rem;">FitRise: Wake Up & Move</h1>
    <div id="clock">00:00:00</div>
    
    <input type="time" id="alarmTime">
    <br>
    
    <button class="btn" id="saveBtn">Set Alarm</button>

    <script>
        // 1. Update the Clock display every second
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }, 1000);

        // 2. The logic that was showing on your screen - now safely inside <script>
        document.getElementById('saveBtn').addEventListener('click', () => { 
            const time = document.getElementById('alarmTime').value;
            if (time) {
                localStorage.setItem('userAlarm', time); 
                alert("Alarm saved for " + time); 
            } else {
                alert("Please select a time first!");
            }
        });
    </script>
</body>
</html>
    
<script type="module">
  const firebaseConfig = {
        apiKey: "AIzaSyBLNz5NxJkxoeTPtxg_m5P547ID4bkiW7Q",
        authDomain: "mediapipe-motioncapture-new.firebaseapp.com",
        projectId: "mediapipe-motioncapture-new",
        storageBucket: "mediapipe-motioncapture-new.firebasestorage.app",
        messagingSenderId: "194144536036",
        appId: "1:194144536036:web:01a57bbef13074c42733f1"

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 1. Clock Update
    setInterval(() => {
        const now = new Date();
        const currentTime = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');

        // 2. Check the Alarm
        const savedAlarm = localStorage.getItem('userAlarm');
        
        // We log this so you can see the comparison in the Inspect -> Console
        console.log(`Checking: Current(${currentTime}) vs Saved(${savedAlarm})`);

        if (savedAlarm === currentTime) {
            triggerAlarm();
        }
    }, 1000);

    async function triggerAlarm() {
        console.log("ALARM TRIGGERED!");
        
        try {
            // A. Update Firebase so Streamlit knows to start the camera
            await setDoc(doc(db, "alarms", "current"), { 
                isTriggered: true,
                timestamp: new Date() 
            }, { merge: true });

            // B. Perform the Redirect
            // IMPORTANT: Ensure this URL starts with https://
            const streamlitURL = "https://your-app-name.streamlit.app"; 
            window.location.href = streamlitURL;

        } catch (error) {
            console.error("Redirect failed:", error);
        }
    }

    // Button Listener
    document.getElementById('saveBtn').addEventListener('click', () => {
        const time = document.getElementById('alarmTime').value;
        localStorage.setItem('userAlarm', time);
        alert("Alarm set for " + time);
    });
</script>
</body>
</html>
