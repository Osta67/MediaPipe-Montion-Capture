<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitRise | Wake Up & Move</title>
    <style>
        :root { --neon-green: #00ff88; --dark-bg: #0a0a0a; --glass: rgba(255, 255, 255, 0.05); }
        body {
            background-color: var(--dark-bg); color: white; font-family: 'Segoe UI', sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        .container {
            text-align: center; background: var(--glass); padding: 40px 60px;
            border-radius: 24px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }
        h1 { font-size: 1.5rem; letter-spacing: 4px; color: var(--neon-green); margin: 0; }
        #clock { font-size: 7rem; font-weight: 800; margin: 20px 0; text-shadow: 0 0 30px rgba(0, 255, 136, 0.3); }
        .controls { display: flex; flex-direction: column; gap: 15px; }
        input[type="time"] {
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2);
            color: white; padding: 12px; font-size: 1.5rem; border-radius: 12px; text-align: center;
        }
        #saveBtn {
            background: var(--neon-green); color: black; border: none; padding: 15px 30px;
            font-size: 1.1rem; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.3s;
        }
        #saveBtn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 255, 136, 0.4); }
    </style>
</head>
<body>
    <h1 style="font-size: 2.5rem;">FitRise: Wake Up & Move</h1>
    <div id="clock">00:00:00</div>
    
<input type="time" id="alarmTime">
<button id="saveBtn">Set Morning Alarm</button>

<script>
    function updateClock() {
        const clockElement = document.getElementById('clock');
        if (clockElement) {
            const now = new Date();
            // Forces HH:MM:SS format
            clockElement.innerText = now.toLocaleTimeString('en-GB');
        }
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBLNz5NxJkxoeTPtxg_m5P547ID4bkiW7Q",
        authDomain: "mediapipe-motioncapture-new.firebaseapp.com",
        projectId: "mediapipe-motioncapture-new",
        storageBucket: "mediapipe-motioncapture-new.firebasestorage.app",
        messagingSenderId: "194144536036",
        appId: "1:194144536036:web:01a57bbef13074c42733f1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('saveBtn').addEventListener('click', () => {
        const timeVal = document.getElementById('alarmTime').value;
        if (timeVal) {
            localStorage.setItem('userAlarm', timeVal);
            alert(" Alarm saved for " + timeVal);
        }
    });

    setInterval(async () => {
        const now = new Date();
        const currentHHMM = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
        const savedAlarm = localStorage.getItem('userAlarm');

        if (savedAlarm === currentHHMM && !window.triggered) {
            window.triggered = true;
            try {
                await setDoc(doc(db, "alarms", "current"), { isTriggered: true }, { merge: true });
                window.location.href = "https://your-app-name.streamlit.app";
            } catch (e) {
                window.location.href = "https://your-app-name.streamlit.app";
            }
        }
    }, 1000);
</script>
</body>
</html>
