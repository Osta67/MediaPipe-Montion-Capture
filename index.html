<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitRise Alarm</title>
    <style>
        body { background: #121212; color: #00ff88; font-family: 'Arial', sans-serif; text-align: center; padding-top: 100px; }
        #clock { font-size: 8rem; font-weight: bold; margin-bottom: 20px; }
        input[type="time"] { font-size: 2rem; padding: 10px; border-radius: 8px; border: none; margin-bottom: 20px; }
        .btn { background: #00ff88; color: #121212; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;}
        .btn:hover { background: #00cc6e; transform: scale(1.05); }
    </style>
</head>
<body>

    <h1 style="font-size: 2.5rem;">FitRise: Wake Up & Move</h1>
    <div id="clock">00:00:00</div>
    
    <input type="time" id="alarmTime">
    <br>
    
    <button class="btn" id="saveBtn">Set Alarm</button>

    <script>
        // 1. Update the Clock display every second
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-GB');
        }, 1000);

        // 2. The logic that was showing on your screen - now safely inside <script>
        document.getElementById('saveBtn').addEventListener('click', () => { 
            const time = document.getElementById('alarmTime').value;
            if (time) {
                localStorage.setItem('userAlarm', time); 
                alert("Alarm saved for " + time); 
            } else {
                alert("Please select a time first!");
            }
        });
    </script>
</body>
</html>

        console.error("Firebase failed to load:", e);
    }

    // 4. Alarm Logic
    function saveAlarm() {
        const val = document.getElementById('alarmTime').value;
        if (val) {
            localStorage.setItem('userAlarm', val);
            alert("Alarm saved for " + val);
        }
    }

    async function triggerAlarm() {
        console.log("Triggering Alarm...");
        try {
            const db = firebase.firestore();
            await db.collection("alarms").doc("current").set({
                isTriggered: true,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            
            console.log("Database updated! Redirecting...");
            window.location.href = "https://your-app-name.streamlit.app?alarm=active";
        } catch (error) {
            console.error("Error writing to database:", error);
        }
    }

    setInterval(() => {
        const now = new Date();
        const timeString = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
        const target = localStorage.getItem('userAlarm');

        if (target === timeString) {
            triggerAlarm();
        }
    }, 1000);
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const db = getFirestore();

async function saveStudySession() {
    // 1. Grab the values from your HTML inputs
    const subjectName = document.getElementById('subjectInput').value;
    const studyDuration = document.getElementById('durationInput').value;

    try {
        // 2. Use addDoc to create a new entry in the "studySchedules" collection
        const docRef = await addDoc(collection(db, "studySchedules"), {
            subject: subjectName,
            duration: studyDuration,
            createdAt: serverTimestamp() // Adds a precise time-stamp from Google's servers
        });

        console.log("Document written with ID: ", docRef.id);
        alert("Schedule saved successfully!");
        
    } catch (e) {
        console.error("Error adding document: ", e);
        alert("Error saving data. Check your Firestore rules!");
    }
}

// 3. Attach it to your button
document.getElementById('saveButton').addEventListener('click', saveStudySession);
</script>
