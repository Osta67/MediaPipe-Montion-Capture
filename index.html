<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

        input[type="time"] { font-size: 2rem; padding: 10px; border-radius: 8px; border: none; margin-bottom: 20px; }
        .btn { background: #00ff88; color: #121212; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; transition: 0.3s; font-weight: bold;}
        .btn:hover { background: #00cc6e; transform: scale(1.05); }
    </style>
</head>
<body>

    <h1 style="font-size: 2.5rem;">FitRise: Wake Up & Move</h1>
    <div id="clock">00:00:00</div>
    
<input type="time" id="alarmTime">
<button id="saveBtn">Set Morning Alarm</button>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const saveBtn = document.getElementById('saveBtn');
        
        if (saveBtn) {
            saveBtn.addEventListener('click', () => {
                const time = document.getElementById('alarmTime').value;
                if (time) {
                    localStorage.setItem('userAlarm', time);
                    alert("Alarm saved for " + time);
                } else {
                    alert("Please select a time first!");
                }
            });

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 3. THE SAVE BUTTON LOGIC
    document.addEventListener('DOMContentLoaded', () => {
        const saveBtn = document.getElementById('saveBtn');
        if (saveBtn) {
            saveBtn.addEventListener('click', () => {
                const timeValue = document.getElementById('alarmTime').value;
                if (timeValue) {
                    localStorage.setItem('userAlarm', timeValue);
                    alert(" Alarm saved for " + timeValue);
                } else {
                    alert("Please select a time!");
                }
            });
        }
    });

    setInterval(async () => {
        const now = new Date();
        const currentHHMM = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
        const savedAlarm = localStorage.getItem('userAlarm');

        if (savedAlarm === currentHHMM && !window.triggered) {
            window.triggered = true; // Prevents looping
            console.log("ALARM MATCH! Redirecting...");
            
            try {
                await setDoc(doc(db, "alarms", "current"), { isTriggered: true }, { merge: true });
                window.location.href = "https://your-app-name.streamlit.app";
            } catch (e) {
                console.error("Firestore Error:", e);
                // Fallback: Redirect anyway if Firebase fails
                window.location.href = "https://your-app-name.streamlit.app";
            }
        }
    }, 1000);
</script>
