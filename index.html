<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitRise Alarm</title>
    <style>
        body { background: #121212; color: #00ff88; font-family: 'Arial', sans-serif; text-align: center; padding-top: 100px; }
        #clock { font-size: 5rem; font-weight: bold; margin-bottom: 20px; }
        input[type="time"] { font-size: 1.5rem; padding: 10px; border-radius: 8px; border: none; }
        button { background: #00ff88; color: #121212; border: none; padding: 15px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>FitRise: Wake Up & Move</h1>
    <div id="clock">00:00:00</div>
    <input type="time" id="alarmTime">
    <br>
    <button id="saveBtn">Set Morning Alarm</button>
    
    <script>
        // Update the Clock display
        setInterval(() => {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-GB', { hour12: false }).substring(0, 5);
            document.getElementById('clock').innerText = now.toLocaleTimeString();

            const targetTime = localStorage.getItem('userAlarm');
            if (targetTime === timeString) {
                triggerAlarm();
            }
        }, 1000);

        function saveAlarm() {
            const time = document.getElementById('alarmTime').value;
            localStorage.setItem('userAlarm', time);
            alert("Alarm saved for " + time);
        }

        function triggerAlarm() {
            // REPLACE THIS URL with your actual Streamlit link after you deploy
            const streamlitURL = "https://your-app-name.streamlit.app";
            window.location.href = streamlitURL + "?alarm=active";
        }
    </script>
</body>
</html>
document.getElementById('saveBtn').addEventListener('click', () => {
    const time = document.getElementById('alarmTime').value;
    localStorage.setItem('userAlarm', time);
    alert("Alarm saved for " + time);
});
