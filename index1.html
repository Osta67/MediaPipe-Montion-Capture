<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PULSE//ALARM — Neural Wakeup System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #02040a;
        }
        .font-mono { 
            font-family: 'Space Grotesk', sans-serif; 
        }
        
        .scanline::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(99, 102, 241, 0.03), rgba(244, 63, 94, 0.01), rgba(16, 185, 129, 0.03));
            z-index: 2;
            background-size: 100% 3px, 4px 100%;
            pointer-events: none;
        }

        @keyframes laser-sweep {
            0% { top: 0%; }
            50% { top: 100%; }
            100% { top: 0%; }
        }
        .laser-bar {
            animation: laser-sweep 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
    </style>

    <script type="module">
        import {
            PoseLandmarker,
            FilesetResolver,
            DrawingUtils
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js";

        const video = document.getElementById("webcam");
        const canvasElement = document.getElementById("output_canvas");
        const canvasCtx = canvasElement.getContext("2d");

        let poseLandmarker;
        let webcamRunning = false;
        let lastVideoTime = -1;

        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });

                video.srcObject = stream;

                // 🔥 FIX: force video visible + playable
                video.muted = true;
                video.playsInline = true;
                await video.play();

                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
                );

                poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numPoses: 1
                });

                canvasElement.width = video.videoWidth;
                canvasElement.height = video.videoHeight;

                webcamRunning = true;
                requestAnimationFrame(loop);

            } catch (err) {
                console.error(err);
                alert(err.message);
            }
        }

        function loop() {
            if (!webcamRunning) return;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            canvasCtx.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);

            const now = performance.now();

            if (video.currentTime !== lastVideoTime && poseLandmarker) {
                lastVideoTime = video.currentTime;

                const results = poseLandmarker.detectForVideo(video, now);

                if (results.landmarks?.length) {
                    const drawingUtils = new DrawingUtils(canvasCtx);

                    for (const lm of results.landmarks) {
                        drawingUtils.drawConnectors(
                            lm,
                            PoseLandmarker.POSE_CONNECTIONS,
                            { color: "#6366F1", lineWidth: 3 }
                        );

                        drawingUtils.drawLandmarks(lm, {
                            color: "#10B981",
                            radius: 3
                        });
                    }
                }
            }

            canvasCtx.restore();
            requestAnimationFrame(loop);
        }

        window.addEventListener("load", () => {
            document.getElementById("initialize-system-btn")
                .addEventListener("click", init);
        });
    </script>
</head>

<body class="text-white">

<!-- ONLY FIX IS HERE ↓↓↓ -->
<div style="position:relative; width:100%; height:70vh;">
    
    <!-- FIXED VIDEO (removed hidden class) -->
    <video 
        id="webcam"
        autoplay
        playsinline
        muted
        class="absolute top-0 left-0 w-full h-full object-cover">
    </video>

    <canvas id="output_canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
</div>

<div style="padding:20px;">
    <button id="initialize-system-btn"
        style="padding:12px 20px; background:#6366F1; color:white; border-radius:10px;">
        START CAMERA SYSTEM
    </button>
</div>

</body>
</html>
