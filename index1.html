<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE//ALARM — FIXED FULL SYSTEM</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background:#02040a;
}
.font-mono { font-family:'Space Grotesk', sans-serif; }

video, canvas {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
}
</style>

<script type="module">
import {
    PoseLandmarker,
    FilesetResolver,
    DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js";

/* ================= STATE ================= */
let video, canvas, ctx;
let poseLandmarker;
let webcamRunning = false;
let lastVideoTime = -1;

/* ================= START SYSTEM ================= */
window.addEventListener("load", () => {
    video = document.getElementById("webcam");
    canvas = document.getElementById("output_canvas");
    ctx = canvas.getContext("2d");

    document.getElementById("initialize-system-btn").addEventListener("click", initSystem);
});

/* ================= INIT SYSTEM ================= */
async function initSystem() {
    try {
        await startCamera();
        await startMediaPipe();

        webcamRunning = true;
        requestAnimationFrame(loop);

        console.log("SYSTEM ONLINE");
    } catch (err) {
        console.error("INIT ERROR:", err);
        alert(err.message);
    }
}

/* ================= CAMERA FIX (CRITICAL) ================= */
async function startCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
        video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
        },
        audio: false
    });

    video.srcObject = stream;

    await new Promise(resolve => {
        video.onloadedmetadata = resolve;
    });

    await video.play(); // 🔥 CRITICAL FIX

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    console.log("Camera ready:", canvas.width, canvas.height);
}

/* ================= MEDIAPIPE ================= */
async function startMediaPipe() {
    const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
    );

    poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
            modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task"
        },
        runningMode: "VIDEO",
        numPoses: 1
    });

    console.log("MediaPipe loaded");
}

/* ================= MAIN LOOP ================= */
function loop() {
    if (!webcamRunning) return;

    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // mirror camera
    ctx.translate(canvas.width, 0);
    ctx.scale(-1, 1);

    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;

        const results = poseLandmarker.detectForVideo(video, performance.now());

        if (results.landmarks?.length) {
            const draw = new DrawingUtils(ctx);

            for (const lm of results.landmarks) {
                draw.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, {
                    color: "#6366F1",
                    lineWidth: 3
                });

                draw.drawLandmarks(lm, {
                    color: "#10B981",
                    radius: 3
                });
            }
        }
    }

    ctx.restore();

    requestAnimationFrame(loop);
}
</script>

</head>

<body class="text-white">

<!-- CAMERA -->
<div style="position:relative; width:100%; height:70vh;">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="output_canvas"></canvas>
</div>

<!-- BUTTON -->
<div style="padding:20px;">
    <button id="initialize-system-btn"
        style="padding:12px 20px; background:#6366F1; color:white; border-radius:10px;">
        START CAMERA SYSTEM
    </button>
</div>

</body>
</html>
