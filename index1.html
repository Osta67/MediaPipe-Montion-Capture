<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PULSE//ALARM FIXED FULL</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#02040a; color:white; font-family:sans-serif; }

video, canvas {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

#video-wrapper {
  position:relative;
  width:100%;
  height:500px;
  overflow:hidden;
}
</style>

<script type="module">
import {
  PoseLandmarker,
  FilesetResolver,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js";

/* ===================== STATE ===================== */
let video, canvas, ctx;
let poseLandmarker;
let running = false;

/* ===================== INIT CAMERA ===================== */
async function initCamera() {
  video = document.getElementById("webcam");
  canvas = document.getElementById("output_canvas");
  ctx = canvas.getContext("2d");

  const stream = await navigator.mediaDevices.getUserMedia({
    video: {
      facingMode: "user",
      width: { ideal: 1280 },
      height: { ideal: 720 }
    },
    audio: false
  });

  video.srcObject = stream;

  // IMPORTANT FIX: wait for video properly
  await new Promise((resolve) => {
    video.onloadedmetadata = () => resolve();
  });

  await video.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  console.log("Camera started:", canvas.width, canvas.height);
}

/* ===================== INIT MEDIAPIPE ===================== */
async function initPose() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
  );

  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });

  console.log("Pose model loaded");
}

/* ===================== LOOP ===================== */
function loop() {
  if (!running) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const results = poseLandmarker.detectForVideo(video, performance.now());

  if (results.landmarks?.length) {
    const draw = new DrawingUtils(ctx);

    for (const lm of results.landmarks) {
      draw.drawConnectors(lm, PoseLandmarker.POSE_CONNECTIONS, {
        color: "#6366F1",
        lineWidth: 3
      });

      draw.drawLandmarks(lm, {
        color: "#10B981",
        radius: 3
      });
    }
  }

  requestAnimationFrame(loop);
}

/* ===================== START ===================== */
async function startApp() {
  try {
    await initCamera();
    await initPose();

    running = true;
    loop();

    console.log("SYSTEM ONLINE");
  } catch (err) {
    console.error("INIT ERROR:", err);
  }
}

window.addEventListener("load", startApp);
</script>

</head>

<body>

<!-- CAMERA VIEW -->
<div id="video-wrapper">
  <video id="webcam" autoplay playsinline muted></video>
  <canvas id="output_canvas"></canvas>
</div>

<!-- SIMPLE UI CHECK -->
<div style="position:relative; z-index:10; padding:20px;">
  <h2>PULSE ALARM FIXED VERSION</h2>
  <p>If camera + skeleton appear → system works</p>
</div>

</body>
</html>
