<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PULSE//ALARM FIXED</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#02040a; color:white; font-family:sans-serif; }
video, canvas {
  position:absolute;
  top:0; left:0;
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>

<script type="module">
import {
  PoseLandmarker,
  FilesetResolver,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0";

let video = document.getElementById("webcam");
let canvas = document.getElementById("output_canvas");
let ctx = canvas.getContext("2d");

let poseLandmarker;
let running = false;

async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = stream;

    await video.play();

    await new Promise(resolve => {
      video.onloadedmetadata = resolve;
    });

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    console.log("Camera ready:", video.videoWidth, video.videoHeight);

  } catch (err) {
    console.error("Camera error:", err);
  }
}

async function initMediaPipe() {
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm"
  );

  poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task"
    },
    runningMode: "VIDEO",
    numPoses: 1
  });

  console.log("MediaPipe loaded");
}

function drawLoop() {
  if (!running) return;

  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const results = poseLandmarker.detectForVideo(video, performance.now());

  if (results.landmarks?.length) {
    const drawingUtils = new DrawingUtils(ctx);

    for (const landmarks of results.landmarks) {
      drawingUtils.drawConnectors(
        landmarks,
        PoseLandmarker.POSE_CONNECTIONS,
        { color: "#6366F1", lineWidth: 3 }
      );

      drawingUtils.drawLandmarks(landmarks, {
        color: "#10B981",
        radius: 3
      });
    }
  }

  ctx.restore();

  requestAnimationFrame(drawLoop);
}

async function start() {
  await initCamera();
  await initMediaPipe();

  running = true;
  drawLoop();
}

window.addEventListener("load", start);
</script>

</head>

<body>

<video id="webcam" autoplay playsinline muted></video>
<canvas id="output_canvas"></canvas>

<div style="position:relative; z-index:10; padding:20px;">
  <h1>Camera + Pose Fixed Version</h1>
  <p>If you see video + skeleton → it works</p>
</div>

</body>
</html>
